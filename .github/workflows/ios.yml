# Compila Musicfy para iPhone en un Mac de GitHub y genera un .ipa SIN FIRMAR.
# Sideloadly lo firma con tu Apple ID gratuito al instalarlo.
#
# Lanzarlo: GitHub → pestaña «Actions» → «iOS build» → «Run workflow».
# El .ipa aparece al final del run, en «Artifacts».
name: iOS build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Release = app autónoma · Debug = cliente de desarrollo (recarga en vivo desde tu PC)'
        type: choice
        options: [Release, Debug]
        default: Release
  push:
    tags: ['v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 58 necesita Xcode 27 (Swift 6.4): con Xcode 26 falla compilando expo-modules-jsi.
    # GitHub ofrece Xcode 27 en una imagen propia (Apple Silicon) con esta etiqueta.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -qE "Xcode 2[7-9]" || { echo "::error::Se necesita Xcode 27 o superior"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto nativo iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install

      # expo-modules-jsi compila su xcframework con un xcodebuild anidado que arranca con
      # `env -i`, así que NO hereda CODE_SIGNING_ALLOWED=NO del build principal y falla en un
      # runner sin certificados. Le añadimos esas opciones al script antes de compilar.
      - name: Desactivar firma en el build anidado de ExpoModulesJSI
        run: node dev/patch-jsi-signing.mjs

      - name: Compilar (sin firma)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          STATUS=$?
          tail -n 60 xcodebuild.log
          if [ $STATUS -ne 0 ]; then
            # Publica los errores como anotaciones (visibles sin iniciar sesión en GitHub).
            grep -E "error:|\*\* BUILD FAILED|did not produce|Signing for|requires a development team" xcodebuild.log \
              | head -n 25 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $STATUS

      - name: Guardar log de compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Empaquetar .ipa
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Musicfy-${CONFIGURATION}.ipa" Payload
          ls -lh "Musicfy-${CONFIGURATION}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Musicfy-${{ env.CONFIGURATION }}-ipa
          path: Musicfy-${{ env.CONFIGURATION }}.ipa
          retention-days: 30
